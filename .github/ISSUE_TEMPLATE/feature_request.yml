name: Feature request
description: Propose an improvement that fits Constructa's product direction
title: "feat: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this proposal.
          required: true
        - label: This proposal keeps simple generation tasks approachable.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and provide an example when useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include mockups, generator definitions, or related references.

name: Bug report
description: Report a reproducible problem in Constructa
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Constructa. Do not include secrets or security vulnerabilities in this form. Report vulnerabilities according to SECURITY.md.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I am using the latest available version or default branch.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide a package version or commit SHA when possible.
      placeholder: main at abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Node.js version, pnpm version, browser, and relevant package versions.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable reproduction, including a generator definition when relevant.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or links to a minimal reproduction.

name: Publish to JSR

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Changesets package tag to publish, such as @constructa/core@1.0.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: jsr-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish matching JSR package
        run: pnpm run release:jsr -- --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
